<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10262B">
<title>Drills — Beirut Lebanese</title>
<style>
/* ---------- tokens ---------- */
:root{
  --ground:#10262B;      /* deep petrol */
  --surface:#16333A;
  --surface-2:#1D414A;
  --line:#2A5560;
  --limestone:#E8E2D4;
  --muted:#8FAAAF;
  --ochre:#D9A441;       /* the "typing tax" state */
  --seaglass:#6FB3A8;    /* correct */
  --clay:#C8553D;        /* wrong */
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  color:var(--limestone);
  font-family:var(--sans);
  -webkit-text-size-adjust:100%;
  min-height:100dvh;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
.wrap{max-width:640px;margin:0 auto;padding:18px 18px 40px}

/* ---------- header ---------- */
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:14px}
.mark{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);font-weight:600}
.count{font-family:var(--mono);font-size:13px;color:var(--muted)}
.rail{display:flex;gap:3px;margin-bottom:22px}
.tick{flex:1;height:3px;background:var(--surface-2);border-radius:2px}
.tick.hit{background:var(--seaglass)}
.tick.tax{background:var(--ochre)}
.tick.miss{background:var(--clay)}
.tick.now{background:var(--limestone)}

/* ---------- mode tabs ---------- */
.tabs{display:flex;gap:8px;margin-bottom:22px}
.tab{
  flex:1;padding:10px 8px;background:transparent;color:var(--muted);
  border:1px solid var(--line);border-radius:2px;font-family:var(--sans);
  font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;
  cursor:pointer;
}
.tab[aria-selected="true"]{background:var(--surface-2);color:var(--limestone);border-color:var(--surface-2)}

/* ---------- prompt ---------- */
.eyebrow{
  font-size:11px;letter-spacing:.16em;text-transform:uppercase;
  color:var(--ochre);font-weight:700;margin-bottom:10px
}
.prompt{
  font-size:29px;line-height:1.2;font-weight:650;letter-spacing:-.02em;
  margin:0 0 22px;
}
.prompt .lit{color:var(--muted);font-weight:400}

/* ---------- input ---------- */
.field{
  width:100%;padding:15px 14px;background:var(--surface);
  border:1px solid var(--line);border-top-width:2px;border-radius:2px;
  color:var(--limestone);font-family:var(--mono);font-size:20px;
  letter-spacing:.01em;
}
.field:focus{outline:2px solid var(--ochre);outline-offset:2px;border-color:var(--ochre)}
.field::placeholder{color:#5C7C82}
.field:disabled{opacity:.55}
.go{
  width:100%;margin-top:12px;padding:16px;border:0;border-radius:2px;
  background:var(--limestone);color:var(--ground);
  font-family:var(--sans);font-size:15px;font-weight:700;
  letter-spacing:.06em;text-transform:uppercase;cursor:pointer;
}
.go:active{transform:translateY(1px)}
.hint{margin-top:10px;font-size:12px;color:var(--muted);font-family:var(--mono)}

/* ---------- feedback ---------- */
.fb{margin-top:24px;border-left:2px solid var(--line);padding-left:14px}
.fb.correct{border-color:var(--seaglass)}
.fb.tax{border-color:var(--ochre)}
.fb.wrong{border-color:var(--clay)}
.fb .q{font-size:12px;color:var(--muted);margin-bottom:12px;line-height:1.4}
.fb .row{display:flex;gap:9px;align-items:flex-start;margin-bottom:9px;font-size:16px;line-height:1.4}
.fb .row .sym{flex:none;width:20px}
.fb .row .val{font-family:var(--mono);word-break:break-word}
.fb .bad{color:var(--clay)}
.fb .good{color:var(--seaglass)}
.fb .taxc{color:var(--ochre)}
.fb .why{font-size:14px;color:var(--limestone);opacity:.85;line-height:1.5}
.fb .why b{color:var(--ochre);font-weight:600}

/* ---------- score ---------- */
.score{padding:4px 0}
.score h2{font-size:34px;margin:0 0 4px;letter-spacing:-.02em}
.score .sub{color:var(--muted);font-size:14px;margin-bottom:26px}
.bd{border-top:1px solid var(--line);padding:13px 0;display:flex;justify-content:space-between;font-size:15px}
.bd .n{font-family:var(--mono)}
.leak{margin-top:26px}
.leak h3{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ochre);margin:0 0 10px}
.leak li{font-family:var(--mono);font-size:14px;margin-bottom:7px;color:var(--limestone)}
.leak ul{margin:0;padding-left:18px}
@media (prefers-reduced-motion:no-preference){
  .fb,.prompt{animation:in .18s ease-out}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="mark">Drills</div>
    <div class="count" id="count"></div>
  </div>
  <div class="rail" id="rail"></div>
  <div class="tabs" role="tablist">
    <button class="tab" id="tab-conj" role="tab" aria-selected="true">Conjugation</button>
    <button class="tab" id="tab-sent" role="tab" aria-selected="false">Sentences</button>
  </div>
  <div id="stage"></div>
</div>

<script>
/* ===================================================================
   BLOCK 1 — DATA.  Every form is explicit and auditable.
   Fix a wrong form here and it is fixed everywhere.
   Paradigm order is always:
   [ana, inta, inte, huwwe, hiyye, ne7na, into, hinne]
   =================================================================== */

const PERSONS = [
  {i:0, en:"I",       has:"have", is3:false, fii:"fiini"},
  {i:1, en:"you",     has:"have", is3:false, fii:"fiik"},
  {i:2, en:"you (f)", has:"have", is3:false, fii:"fiike"},
  {i:3, en:"he",      has:"has",  is3:true,  fii:"fii"},
  {i:4, en:"she",     has:"has",  is3:true,  fii:"fiya"},
  {i:5, en:"we",      has:"have", is3:false, fii:"fiina"},
  {i:6, en:"you all", has:"have", is3:false, fii:"fiikon"},
  {i:7, en:"they",    has:"have", is3:false, fii:"fiyon"}
];
// Feminine address (inte) is off by default — masculine forms only.
const ACTIVE_PERSONS = [0,1,3,4,5,6,7];

const VERBS = [
  {
    id:"ra7", hollow:true, en:{base:"go", s3:"goes", past:"went"},
    past:["ru7t","ru7t","ru7te","ra7","ra7et","ru7na","ru7to","ra7o"],
    bare:["rou7","trou7","trou7e","yrou7","trou7","nrou7","trou7o","yrou7o"],
    bform:["brou7","btrou7","btrou7e","birou7","btrou7","mnrou7","btrou7o","birou7o"],
    comps:[{ar:"3al-bank",en:"to the bank"},{ar:"3al-beit",en:"home"},{ar:"3ash-shighel",en:"to work"}]
  },
  {
    id:"shaaf", hollow:true, en:{base:"see", s3:"sees", past:"saw"},
    past:["shift","shift","shifte","shaaf","shaafet","shifna","shifto","shaafo"],
    bare:["shouf","tshouf","tshoufe","yshouf","tshouf","nshouf","tshoufo","yshoufo"],
    bform:["bshouf","btshouf","btshoufe","bishouf","btshouf","mnshouf","btshoufo","bishoufo"],
    comps:[{ar:"as7aabi",en:"my friends"},{ar:"el-film",en:"the film"}]
  },
  {
    id:"kaan", hollow:true, en:{base:"be", s3:"is", past:"was"},
    past:["kint","kint","kinte","kaan","kaanet","kinna","kinto","kaano"],
    bare:["koun","tkoun","tkoune","ykoun","tkoun","nkoun","tkouno","ykouno"],
    bform:["bkoun","btkoun","btkoune","bikoun","btkoun","mnkoun","btkouno","bikouno"],
    comps:[]
  },
  {
    id:"jaab", hollow:true, en:{base:"bring", s3:"brings", past:"brought"},
    past:["jibt","jibt","jibte","jaab","jaabet","jibna","jibto","jaabo"],
    bare:["jeeb","tjeeb","tjeebe","yjeeb","tjeeb","njeeb","tjeebo","yjeebo"],
    bform:["bjeeb","btjeeb","btjeebe","bijeeb","btjeeb","mnjeeb","btjeebo","bijeebo"],
    comps:[{ar:"el-akel",en:"the food"},{ar:"ahwe",en:"coffee"}]
  },
  {
    id:"naam", hollow:true, en:{base:"sleep", s3:"sleeps", past:"slept"},
    past:["nimt","nimt","nimte","naam","naamet","nimna","nimto","naamo"],
    bare:["naam","tnaam","tnaame","ynaam","tnaam","nnaam","tnaamo","ynaamo"],
    bform:["bnaam","btnaam","btnaame","binaam","btnaam","mnnaam","btnaamo","binaamo"],
    comps:[]
  },
  {
    id:"shirib", hollow:false, en:{base:"drink", s3:"drinks", past:"drank"},
    past:["shribt","shribt","shribte","shirib","shirbet","shribna","shribto","shirbo"],
    bare:["shrab","tishrab","tishrabe","yishrab","tishrab","nishrab","tishrabo","yishrabo"],
    bform:["bishrab","btishrab","btishrabe","byishrab","btishrab","mnishrab","btishrabo","byishrabo"],
    comps:[{ar:"ahwe",en:"coffee"},{ar:"shay",en:"tea"}]
  },
  {
    id:"akal", hollow:false, en:{base:"eat", s3:"eats", past:"ate"},
    past:["akalt","akalt","akalte","akal","akalet","akalna","akalto","akalo"],
    bare:["aakol","taakol","taakle","yaakol","taakol","naakol","taaklo","yaaklo"],
    bform:["baakol","btaakol","btaakle","byaakol","btaakol","mnaakol","btaaklo","byaaklo"],
    comps:[{ar:"bel-mat3am",en:"at the restaurant"}]
  },
  {
    id:"katab", hollow:false, en:{base:"write", s3:"writes", past:"wrote"},
    past:["katabt","katabt","katabte","katab","katbet","katabna","katabto","katabo"],
    bare:["ktob","tiktob","tiktbe","yiktob","tiktob","niktob","tiktbo","yiktbo"],
    bform:["biktob","btiktob","btiktbe","byiktob","btiktob","mniktob","btiktbo","byiktbo"],
    comps:[]
  },
  {
    id:"3imil", hollow:false, en:{base:"do", s3:"does", past:"did"},
    past:["3milt","3milt","3milte","3imil","3imlet","3milna","3milto","3imlo"],
    bare:["3mol","ta3mol","ta3mle","ya3mol","ta3mol","na3mol","ta3mlo","ya3mlo"],
    bform:["ba3mol","bta3mol","bta3mle","bya3mol","bta3mol","mna3mol","bta3mlo","bya3mlo"],
    comps:[]
  }
];

/* Constructions. `slot` says which paradigm the bare verb comes from —
   this is the whole point of the ra7 / lazem / fiini drills. */
const CONSTRUCTIONS = [
  {id:"past",     label:"Past",              slot:"past",  time:"mbaari7", timeEn:"yesterday",
   build:(v,p)=>v.past[p.i],
   en:(v,p)=>`${p.en} ${v.en.past}`},

  {id:"pastNeg",  label:"Past · negative",   slot:"past",  time:"mbaari7", timeEn:"yesterday",
   build:(v,p)=>`ma ${v.past[p.i]}`,
   en:(v,p)=>`${p.en} didn't ${v.en.base}`},

  {id:"pres",     label:"Habitual present",  slot:"bform", time:"kill yom", timeEn:"every day",
   build:(v,p)=>v.bform[p.i],
   en:(v,p)=>`${p.en} ${p.is3?v.en.s3:v.en.base}`},

  {id:"presNeg",  label:"Present · negative",slot:"bform", time:"kill yom", timeEn:"every day",
   build:(v,p)=>`ma ${v.bform[p.i]}`,
   en:(v,p)=>`${p.en} ${p.is3?"doesn't":"don't"} ${v.en.base}`},

  {id:"future",   label:"Future · ra7",      slot:"bare",  time:"bukra", timeEn:"tomorrow",
   build:(v,p)=>`ra7 ${v.bare[p.i]}`,
   en:(v,p)=>`${p.en} will ${v.en.base}`},

  {id:"futureNeg",label:"Future · negative", slot:"bare",  time:"bukra", timeEn:"tomorrow",
   build:(v,p)=>`ma ra7 ${v.bare[p.i]}`,
   en:(v,p)=>`${p.en} won't ${v.en.base}`},

  {id:"lazem",    label:"Obligation · lazem",slot:"bare",  time:"bukra", timeEn:"tomorrow",
   build:(v,p)=>`lazem ${v.bare[p.i]}`,
   en:(v,p)=>`${p.en} ${p.has} to ${v.en.base}`},

  {id:"fiini",    label:"Ability · fiini",   slot:"bare",  time:"bukra", timeEn:"tomorrow",
   build:(v,p)=>`${p.fii} ${v.bare[p.i]}`,
   en:(v,p)=>`${p.en} can ${v.en.base}`}
];

const NOTES = {
  modal:"After <b>ra7 / lazem / fiini</b> the verb takes the bare imperfect: the person prefix stays, the <b>b-</b> drops. Not <i>ra7 brou7</i> — <i>ra7 rou7</i>.",
  hollowShort:"Hollow verb, consonant ending → <b>short stem</b> (ru7t, shift, kint). Long stem only bare or before a vowel ending (ra7, ra7et, ra7o).",
  hollowLong:"Hollow verb, bare or vowel ending → <b>long stem</b> (ra7, ra7et, ra7o). Short stem only before a consonant ending.",
  neg:"<b>ma</b> sits in front of the whole verb and changes nothing inside it.",
  bform:"Habitual present carries the <b>b-</b> prefix on top of the person prefix — byishrab, mnishrab.",
  order:"Time word goes at the front or the very end; the verb block stays together."
};

/* ===================================================================
   BLOCK 2 — GENERATOR.  Pure functions, no DOM. Lift this straight
   into the app; it is the only part that needs to be correct.
   =================================================================== */

const pick = a => a[Math.floor(Math.random()*a.length)];

function personFor(){ return PERSONS[pick(ACTIVE_PERSONS)]; }

function noteFor(c, v, p){
  if(c.slot==="bare" && c.id!=="past") return NOTES.modal;
  if(c.slot==="past" && v.hollow){
    const longStem = [3,4,7].includes(p.i);
    return longStem ? NOTES.hollowLong : NOTES.hollowShort;
  }
  if(c.id==="presNeg"||c.id==="pastNeg") return NOTES.neg;
  if(c.id==="pres") return NOTES.bform;
  return NOTES.bform;
}

function conjugationDrill(){
  const c = pick(CONSTRUCTIONS);
  const v = pick(VERBS);
  const p = personFor();
  const answer = c.build(v,p);
  return {
    eyebrow: c.label,
    prompt: c.en(v,p),
    accept: [answer],
    note: noteFor(c,v,p),
    tag: c.id
  };
}

function sentenceDrill(){
  const c = pick(CONSTRUCTIONS);
  const v = pick(VERBS.filter(x=>x.comps.length));
  const p = personFor();
  const comp = pick(v.comps);
  const core = `${c.build(v,p)} ${comp.ar}`;
  return {
    eyebrow: `${c.label} · full sentence`,
    prompt: `${cap(c.timeEn)}, ${c.en(v,p)} ${comp.en}.`,
    // both word orders are natural — accept either
    accept: [`${c.time} ${core}`, `${core} ${c.time}`],
    note: noteFor(c,v,p) + " " + NOTES.order,
    tag: c.id
  };
}

const cap = s => s[0].toUpperCase()+s.slice(1);

/* ---- answer checking: three states, not two ---- */
function normalise(s){
  return s.toLowerCase().trim().replace(/[.,!?]/g,"").replace(/\s+/g," ");
}
function lev(a,b){
  const m=a.length,n=b.length,d=Array.from({length:m+1},(_,i)=>[i,...Array(n).fill(0)]);
  for(let j=0;j<=n;j++) d[0][j]=j;
  for(let i=1;i<=m;i++) for(let j=1;j<=n;j++)
    d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return d[m][n];
}
const sortedChars = s => s.replace(/\s/g,"").split("").sort().join("");

// "typing tax": one transposition or one doubled/dropped letter in a word
// he plainly knows. Not a knowledge error — must not be scored as one.
function judge(given, accept){
  const g = normalise(given);
  for(const a of accept){
    const t = normalise(a);
    if(g === t) return {state:"correct", target:a};
    const dist = lev(g,t);
    if(dist <= 1) return {state:"tax", target:a};
    if(dist === 2 && sortedChars(g) === sortedChars(t)) return {state:"tax", target:a};
  }
  return {state:"wrong", target:accept[0]};
}

/* ===================================================================
   BLOCK 3 — UI
   =================================================================== */

const LEN = 15;
let mode = "conj", queue = [], idx = 0, marks = [], leaks = [], retry = null;

function build(){
  queue = Array.from({length:LEN}, () => mode==="conj" ? conjugationDrill() : sentenceDrill());
  idx = 0; marks = []; leaks = []; retry = null;
  render();
}

function rail(){
  const r = document.getElementById("rail");
  r.innerHTML = "";
  for(let i=0;i<LEN;i++){
    const d = document.createElement("div");
    d.className = "tick" + (marks[i] ? " "+({correct:"hit",tax:"tax",wrong:"miss"})[marks[i]] : (i===idx?" now":""));
    r.appendChild(d);
  }
  document.getElementById("count").textContent = idx<LEN ? `${idx+1} / ${LEN}` : `${LEN} / ${LEN}`;
}

function render(){
  rail();
  const stage = document.getElementById("stage");
  if(idx >= LEN) return score();
  const q = queue[idx];
  stage.innerHTML = `
    <div class="eyebrow">${q.eyebrow}</div>
    <p class="prompt">${q.prompt}</p>
    <input class="field" id="ans" placeholder="type it in Arabizi"
      autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="latin">
    <button class="go" id="go">Check</button>
    <div class="hint">3 = ع &nbsp; 7 = ح &nbsp; no apostrophes</div>
    <div id="fb"></div>`;
  const input = document.getElementById("ans");
  input.focus();
  const submit = () => check(input.value);
  document.getElementById("go").onclick = submit;
  input.onkeydown = e => { if(e.key === "Enter") submit(); };
}

function check(val){
  if(!val.trim()) return;
  const q = queue[idx];
  const r = judge(val, q.accept);
  marks[idx] = r.state;
  if(r.state === "wrong") leaks.push(`${q.accept[0]}  —  ${q.prompt}`);
  rail();

  const sym = {correct:"✅", tax:"⌫", wrong:"❌"}[r.state];
  const cls = {correct:"good", tax:"taxc", wrong:"bad"}[r.state];
  const fb = document.getElementById("fb");
  fb.className = "fb " + r.state;

  if(r.state === "correct"){
    fb.innerHTML = `
      <div class="q">${q.prompt}</div>
      <div class="row"><span class="sym">✅</span><span class="val good">${r.target}</span></div>`;
    document.getElementById("ans").disabled = true;
    const go = document.getElementById("go");
    go.textContent = "Next"; go.onclick = next;
    document.onkeydown = e => { if(e.key === "Enter") next(); };
    return;
  }

  const taxLine = r.state === "tax"
    ? `<div class="why">Typing tax — letters transposed, not a grammar miss. Not counted against you.</div>`
    : `<div class="why">${q.note}</div>`;

  fb.innerHTML = `
    <div class="q">${q.prompt}</div>
    <div class="row"><span class="sym">${sym}</span><span class="val ${cls}">${val}</span></div>
    <div class="row"><span class="sym">✅</span><span class="val good">${r.target}</span></div>
    <div class="row"><span class="sym">💡</span><span>${taxLine}</span></div>
    <div class="row"><span class="sym">🔁</span><span class="val" style="color:var(--muted)">retype it once to continue</span></div>`;

  retry = r.target;
  const input = document.getElementById("ans");
  input.value = ""; input.focus();
  const go = document.getElementById("go");
  go.textContent = "Confirm";
  const confirm = () => {
    if(judge(input.value, [retry]).state === "wrong") { input.focus(); return; }
    next();
  };
  go.onclick = confirm;
  input.onkeydown = e => { if(e.key === "Enter") confirm(); };
}

function next(){ document.onkeydown = null; idx++; render(); }

function score(){
  document.onkeydown = null;
  const n = s => marks.filter(m => m===s).length;
  const real = LEN - n("tax");
  const pct = real ? Math.round(n("correct")/real*100) : 100;
  document.getElementById("stage").innerHTML = `
    <div class="score">
      <div class="eyebrow">Session done</div>
      <h2>${pct}%</h2>
      <div class="sub">${n("correct")} of ${real} scored items. Typing tax excluded.</div>
      <div class="bd"><span>Correct</span><span class="n">${n("correct")}</span></div>
      <div class="bd"><span>Missed</span><span class="n">${n("wrong")}</span></div>
      <div class="bd"><span>Typing tax</span><span class="n">${n("tax")}</span></div>
      ${leaks.length ? `<div class="leak"><h3>Drill these again</h3><ul>${
        leaks.map(l=>`<li>${l}</li>`).join("")}</ul></div>` : ""}
      <button class="go" id="again" style="margin-top:28px">Run another ${LEN}</button>
    </div>`;
  document.getElementById("again").onclick = build;
}

document.getElementById("tab-conj").onclick = () => setMode("conj");
document.getElementById("tab-sent").onclick = () => setMode("sent");
function setMode(m){
  mode = m;
  document.getElementById("tab-conj").setAttribute("aria-selected", m==="conj");
  document.getElementById("tab-sent").setAttribute("aria-selected", m==="sent");
  build();
}
build();
</script>
</body>
</html>
